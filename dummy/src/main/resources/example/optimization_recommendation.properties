############################################################
#                SUT defined configurations                #
############################################################
host=localhost
port=9091
user=admin
pass=123456
path=cypher/

############################################################
#                    Driver configurations                 #
############################################################
status=1
thread_count=1
name=LDBC-FinBench
# Modes available: 1.CREATE_VALIDATION 2.VALIDATE_DATABASE 3.EXECUTE_BENCHMARK 4.OPTIMIZATION_RECOMMENDATION
mode=OPTIMIZATION_RECOMMENDATION
results_dir=results/optimization
results_log=true
time_unit=MICROSECONDS
time_compression_ratio=0.0001
peer_identifiers=
workload_statistics=false
spinner_wait_duration=1
help=false
ignore_scheduled_start_times=true
workload=org.ldbcouncil.finbench.driver.workloads.transaction.LdbcFinBenchTransactionWorkload
db=org.ldbcouncil.finbench.impls.dummy.DummyDb
operation_count=200
validation_parameters_size=1000
validate_workload=false
validate_database=validation_params.csv
warmup=0

############################################################
#        Optimization recommendation configurations         #
############################################################
# Number of top-ranked operation types to evaluate with synthetic optimization scenarios.
optimization.top_n=3
# Comma-separated duration reduction ratios. For example, 0.05 means the selected operation
# is simulated with a 5% shorter duration during a full-workload scenario rerun.
optimization.reduction_steps=0.05,0.10,0.20
# Number of representative single-operation executions used to profile CPU, memory, and duration.
optimization.profile_repetitions=3
# Number of full-workload scenario reruns for each selected operation and reduction ratio.
optimization.repetitions=1
# CPU and memory sampling interval, in milliseconds, while profiling a representative operation.
optimization.sample_interval_millis=20

############################################################
#              Transaction workload configurations          #
# Paths are relative to the dummy module root when running run_optimization_recommendation.sh.
############################################################
ldbc.finbench.transaction.queries.parameters_dir=src/main/resources/example/data/read_params
ldbc.finbench.transaction.queries.updates_dir=src/main/resources/example/data/incremental
ldbc.finbench.transaction.queries.files_suffix=csv
ldbc.finbench.transaction.queries.simple_read_dissipation=0.2
ldbc.finbench.transaction.queries.update_interleave=1
ldbc.finbench.transaction.queries.scale_factor=1

